[project]
name = "ravisn"
version = "1.0.0"
description = "Ravisn Ltd local catalogue and supplier management"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
